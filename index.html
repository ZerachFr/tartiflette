<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tartiflette</title>
<meta name="theme-color" content="#F1F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tartiflette">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap">
<style>
:root {
  --paper: #F1F2F4;
  --surface: #FFFFFF;
  --ink: #15171C;
  --muted: #5A606E;
  --line: #D9DCE2;
  --soft: #E8EAEE;
  --l1: #3348A6;
  --l2: #BE3A22;
  --l3: #9C7410;
  --ok: #2E7D4F;
  --bad: #B4322A;
  --accent: #3E4BB8;
  --scale: 1;
  --f-text: "Literata", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --paper: #0F1115; --surface: #171A20; --ink: #E7E8EB; --muted: #9AA1AE; --line: #2A2F38; --soft: #20242C;
    --l1: #93A5FF; --l2: #FF8466; --l3: #E3B84A; --ok: #6CCB94; --bad: #FF7B70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1115; --surface: #171A20; --ink: #E7E8EB; --muted: #9AA1AE; --line: #2A2F38; --soft: #20242C;
  --l1: #93A5FF; --l2: #FF8466; --l3: #E3B84A; --ok: #6CCB94; --bad: #FF7B70;
  color-scheme: dark;
}
html { font-size: calc(16px * var(--scale)); scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 120px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.lv1 { --lv: var(--l1); } .lv2 { --lv: var(--l2); } .lv3 { --lv: var(--l3); }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 14px; min-height: 56px; }
.top .title { flex: 1; min-width: 0; font-weight: 700; font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { font-family: var(--f-text); font-weight: 700; font-size: 1.3rem; letter-spacing: .01em; }
.icon-btn { background: none; border: 0; min-width: 44px; min-height: 44px; display: grid; place-items: center; border-radius: 50%; cursor: pointer; color: var(--ink); }
.icon-btn svg { width: 24px; height: 24px; }
.who { font-size: .82rem; color: var(--muted); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 10px; background: var(--surface); cursor: pointer; white-space: nowrap; }

main { max-width: 760px; margin: 0 auto; padding: 18px 18px calc(110px + env(safe-area-inset-bottom, 0px)); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { background: none; border: 0; padding: 9px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .74rem; color: var(--muted); cursor: pointer; position: relative; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 700; }
.nav .count { position: absolute; top: 4px; left: calc(50% + 8px); background: var(--l2); color: #fff; border-radius: 999px; font-size: .68rem; padding: 0 6px; line-height: 1.5; font-weight: 700; }

/* Typo */
h1, h2, h3 { font-family: var(--f-text); line-height: 1.2; }
h1 { font-size: 2.1rem; margin: 6px 0 8px; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.45rem; margin: 30px 0 10px; font-weight: 700; }
h3 { font-size: 1.15rem; margin: 22px 0 8px; font-weight: 700; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.lead { font-family: var(--f-text); font-size: 1.12rem; line-height: 1.6; max-width: 62ch; }

/* Texte de lecture */
.reading { font-family: var(--f-text); font-size: 1.08rem; line-height: 1.75; max-width: 64ch; }
.reading p { margin: 0 0 1.05em; }
.reading h3 { font-size: 1.22rem; margin: 1.6em 0 .5em; }
.reading ul { padding-left: 1.2em; margin: 0 0 1.05em; }
.reading li { margin-bottom: .4em; }
.reading .callout { border-left: 4px solid var(--lv, var(--accent)); background: var(--surface); padding: 12px 16px; border-radius: 0 10px 10px 0; margin: 1.2em 0; font-size: 1.02rem; }
.reading strong { font-weight: 700; }
.wl { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: pointer; }
.wl.missing { color: var(--muted); text-decoration-style: dotted; cursor: help; }
.gl { background: none; border: 0; padding: 0; font: inherit; color: inherit; border-bottom: 2px dotted var(--muted); cursor: pointer; }

/* Cartes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.row { display: flex; gap: 10px; align-items: center; }
.wrap { flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); padding: 9px 16px; min-height: 44px; cursor: pointer; font-size: .95rem; text-decoration: none; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 700; }
.btn.lv { background: var(--lv); color: var(--surface); border-color: var(--lv); font-weight: 700; }
.btn.small { min-height: 36px; padding: 5px 12px; font-size: .85rem; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; }

/* Accueil */
.hero { padding: 10px 0 8px; }
.hero h1 { font-size: 2.5rem; }
.logo-old { display: inline-flex; flex-direction: column; gap: 4px; vertical-align: middle; margin-right: 12px; }
.logo i { display: block; height: 7px; width: 32px; border-radius: 4px; }
.logo i:nth-child(1) { background: var(--l3); } .logo i:nth-child(2) { background: var(--l2); } .logo i:nth-child(3) { background: var(--l1); }
.deco { font-size: .7em; margin-left: 10px; vertical-align: middle; }
.review-card { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
.review-card .big { font-family: var(--f-text); font-size: 2.4rem; font-weight: 700; line-height: 1; color: var(--l2); min-width: 1.4em; text-align: center; }
.pack-card { display: block; width: 100%; text-align: left; cursor: pointer; border-top: 6px solid var(--accent); padding: 18px; }
.pack-card h2 { margin: 0 0 4px; font-size: 1.6rem; color: var(--accent); }
.pack-card .q { font-family: var(--f-text); font-style: italic; font-size: 1.05rem; margin: 10px 0 14px; }
.meter { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: .82rem; }
.meter .bar { height: 7px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--lv); }

/* Onglets du sujet */
.tabs { display: flex; gap: 2px; overflow-x: auto; margin: 0 -18px 18px; padding: 0 18px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; background: none; border: 0; padding: 12px 12px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; font-size: .98rem; min-height: 46px; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--accent); font-weight: 700; }
.pack-head .kd { display: inline-block; font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin-bottom: 8px; }
.pack-head h1 { color: var(--accent); }

/* Parcours */
.path { list-style: none; margin: 0; padding: 0; counter-reset: n; }
.path li { counter-increment: n; }
.path button.item { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; cursor: pointer; }
.path .num { font-family: var(--f-text); font-weight: 700; color: var(--muted); font-size: .9rem; }
.path h3 { margin: 0; font-size: 1.05rem; }
.path .sum { font-size: .86rem; color: var(--muted); margin-top: 2px; }
.minis { display: flex; flex-direction: column-reverse; gap: 3px; }
.minis i { display: block; width: 22px; height: 5px; border-radius: 3px; background: var(--soft); }
.minis i.on1 { background: var(--l1); } .minis i.on2 { background: var(--l2); } .minis i.on3 { background: var(--l3); }
.minis.wide i { width: 34px; height: 6px; }

/* Fiche notion */
.notion-head { display: grid; grid-template-columns: 1fr 84px; gap: 14px; align-items: start; }
.notion-head .crumb { font-size: .85rem; color: var(--muted); }
.notion-head h1 { font-size: 1.9rem; }
.levelbar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 10; background: var(--paper); margin: 8px -18px 0; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.levelbar-in { display: grid; grid-template-columns: 48px 1fr 48px; gap: 10px; align-items: center; }
.step { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.5rem; line-height: 1; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
.step[disabled] { opacity: .35; cursor: default; }
.strata { display: flex; align-items: center; gap: 12px; justify-content: center; }
.strata .bars { display: flex; flex-direction: column-reverse; gap: 4px; }
.strata .bars i { display: block; width: 46px; height: 8px; border-radius: 4px; background: var(--soft); transition: background-color .2s; }
.strata .bars i.f1 { background: var(--l1); } .strata .bars i.f2 { background: var(--l2); } .strata .bars i.f3 { background: var(--l3); }
.strata .lab { font-weight: 700; font-size: 1.02rem; min-width: 8.5em; }
.strata .lab small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
.adds { font-size: .88rem; color: var(--muted); margin: 14px 0 4px; }
.adds b { color: var(--lv); }
.pending { border: 1.5px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; color: var(--muted); margin: 18px 0; }
.test-cta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 26px 0 8px; padding: 16px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--lv); }
.section-list { list-style: none; padding: 0; margin: 0; }
.section-list li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.section-list li:last-child { border-bottom: 0; }
.myth { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; min-height: 38px; cursor: pointer; font-size: .88rem; display: inline-flex; align-items: center; gap: 6px; }
.chip .y { font-weight: 700; color: var(--accent); }
.res { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.res:last-child { border-bottom: 0; }
.res .ic { width: 34px; height: 34px; border-radius: 8px; background: var(--soft); display: grid; place-items: center; }
.res .ic svg { width: 18px; height: 18px; }
.res a.t, .res span.t { font-weight: 700; text-decoration: none; }
.res a.t:hover { text-decoration: underline; }
.tag { display: inline-block; font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; border: 1.5px solid currentColor; margin-left: 6px; vertical-align: 1px; }
.tag.en { color: var(--l2); }
.tag.lvl { color: var(--muted); border-width: 1px; font-weight: 400; }
textarea { width: 100%; min-height: 120px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px; line-height: 1.55; resize: vertical; font-family: var(--f-text); font-size: 1rem; }
input[type="text"], input[type="search"] { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 44px; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
.pn button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; min-height: 60px; }
.pn button.next { text-align: right; }
.pn small { display: block; color: var(--muted); font-size: .78rem; }

/* Tampons */
.stamp { width: 100%; height: 100%; display: block; }
.stamp-slot { width: 84px; height: 84px; }
.stamp.pressed { animation: press .5s cubic-bezier(.2,.9,.3,1.25); }
@keyframes press { 0% { transform: scale(1.7) rotate(-16deg); opacity: 0; } 55% { opacity: 1; } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .stamp.pressed { animation: none; } .strata .bars i { transition: none; } }

/* Quiz */
.quiz-prog { display: flex; gap: 6px; margin: 4px 0 18px; }
.quiz-prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--soft); }
.quiz-prog i.ok { background: var(--ok); } .quiz-prog i.ko { background: var(--bad); } .quiz-prog i.cur { background: var(--lv); }
.qtext { font-family: var(--f-text); font-size: 1.3rem; line-height: 1.4; margin: 0 0 18px; font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; cursor: pointer; font-size: 1rem; min-height: 54px; }
.opt:hover:not([disabled]) { border-color: var(--muted); }
.opt.good { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.opt[disabled] { cursor: default; }
.explain { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border-left: 4px solid var(--ok); }
.explain.ko { border-left-color: var(--bad); }
.result { text-align: center; padding: 20px 0; }
.result .stamp-slot { width: 150px; height: 150px; margin: 0 auto 10px; }
.result .score { font-family: var(--f-text); font-size: 2.8rem; font-weight: 700; line-height: 1; }
.review-src { font-size: .82rem; color: var(--muted); margin-bottom: 6px; }

/* Enquête */
.inq-hero { font-family: var(--f-text); font-size: 1.55rem; line-height: 1.3; font-style: italic; margin: 6px 0 18px; padding-left: 16px; border-left: 4px solid var(--accent); }
.clue { position: relative; }
.clue .n { font-family: var(--f-text); font-weight: 700; color: var(--accent); font-size: .9rem; }
.clue h3 { margin: 2px 0 6px; }
.clue .found { margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 9%, var(--surface)); font-family: var(--f-text); }
.clue .locked { margin-top: 12px; padding: 10px 14px; border-radius: 10px; border: 1.5px dashed var(--line); color: var(--muted); font-size: .88rem; }
.nlinks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

/* Frise */
.tl { position: relative; padding-left: 26px; }
.tl::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl .ev { position: relative; padding: 0 0 22px; }
.tl .ev::before { content: ""; position: absolute; left: -23px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--accent); }
.tl .ev.hl::before { background: var(--accent); }
.tl .ev.hl .box { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.tl .y { font-family: var(--f-text); font-weight: 700; color: var(--accent); font-size: 1.05rem; }
.tl .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 4px; }
.tl h3 { margin: 0 0 4px; font-size: 1.05rem; }

/* Glossaire */
.gloss dt { font-weight: 700; margin-top: 14px; font-family: var(--f-text); font-size: 1.05rem; }
.gloss dd { margin: 2px 0 0; color: var(--ink); }
.gloss dd .used { font-size: .82rem; color: var(--muted); margin-top: 4px; }

/* Figures interactives */
.figure { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 1.4em 0; font-family: var(--f-ui); font-size: .92rem; line-height: 1.45; }
.figure .ft { font-weight: 700; margin-bottom: 8px; }
.figure svg { width: 100%; height: auto; display: block; }
.figure input[type="range"] { width: 100%; accent-color: var(--accent); }
.figure .out { font-variant-numeric: tabular-nums; }
.figure .chips { margin: 8px 0; }
.figure .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Feuille modale */
.sheet { position: fixed; inset: 0; z-index: 45; background: rgba(8, 10, 14, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet-in { background: var(--surface); width: 100%; max-width: 760px; max-height: 85vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 20px); }
.sheet-in h3 { margin-top: 0; }
figure.pic { margin: 1.4em 0; text-align: center; }
figure.pic img { max-width: 100%; max-height: 420px; width: auto; height: auto; display: block; margin: 0 auto; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 2px 14px rgba(0, 0, 0, .14); cursor: zoom-in; }
figure.pic figcaption { font-family: var(--f-ui); font-size: .85rem; color: var(--muted); margin-top: 7px; line-height: 1.4; }
.sheet .zoom-img { max-width: 100%; max-height: 72vh; border-radius: 12px; display: block; margin: 0 auto 12px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: .9rem; z-index: 60; max-width: 90vw; text-align: center; }
.empty { text-align: center; padding: 30px 12px; color: var(--muted); }
.profile-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.profile-row input[type="radio"] { width: 22px; height: 22px; accent-color: var(--accent); }

/* Accueil replié */
.pack-row { cursor: pointer; border-left: 5px solid var(--accent); padding: 12px 12px 12px 14px; }
.pack-row:hover { border-color: var(--line); border-left-color: var(--accent); box-shadow: 0 1px 0 var(--line); }
.pr-main { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.pr-main .emoji { font-size: 1.9rem; line-height: 1; width: 44px; text-align: center; }
.pr-t h3 { margin: 0; font-size: 1.12rem; color: var(--accent); }
.peek { color: var(--muted); }
.peek[aria-expanded="true"] { color: var(--ink); background: var(--soft); }
.pr-more { margin: 12px 0 2px 56px; }
.pr-more .q { font-family: var(--f-text); font-style: italic; margin: 6px 0 12px; }
/* Liens entre domaines */
.xtag { display: inline-block; font-family: var(--f-ui); font-size: .72rem; font-weight: 700; padding: 0 6px; margin-left: 5px; border-radius: 4px; background: var(--soft); color: var(--ink); text-decoration: none; vertical-align: 1px; white-space: nowrap; }
/* À développer */
.flag { border: 1.5px dashed var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 12px; min-height: 34px; font-size: .82rem; cursor: pointer; }
.flag:hover { color: var(--ink); border-color: var(--muted); }
.flag[aria-pressed="true"] { border-style: solid; border-color: var(--l2); color: var(--l2); font-weight: 700; }

          <div class="small muted" style="margin-top:8px">État des connaissances : ${esc(p.knowledge || "")}${p._exts.length ? `, ${p._exts.length} extension${p._exts.length > 1 ? "s" : ""}` : ""}</div></div></div>`;
    };
    groups.forEach(([title, list], gi) => {
      if (title) h += `<h3 class="theme-head">${esc(title)}</h3>`;
      if (!detail) h += `<div class="bubbles">` + list.map(bubble).join("") + (gi === groups.length - 1 ? soon.map(([id, e, t]) => `<button class="bubble soon" data-act="soon" data-p="${id}" data-t="${esc(t)}" aria-label="${esc(t)}, bientôt"><span class="b-ring"><span class="b-emoji" aria-hidden="true">${e}</span></span><span class="b-name">${esc(T.DOMAINS[id] ? T.DOMAINS[id].short : t)}</span><span class="b-soon">bientôt</span></button>`).join("") : "") + `</div>`;
      else h += list.map(row).join("");
    });
    if (detail && soon.length) h += `<p class="small muted">Bientôt : ${soon.map(([, e, t]) => e + " " + esc(t)).join(", ")}.</p>`;
    return h;
  }

  /* ---------- Parcours : catégories, notions et sous-notions ---------- */
  const realDesc = n => n._kids.flatMap(c => [c].concat(realDesc(c))).filter(x => !x.group);
  function itemHTML(p, n, num) {
    const lv = levelsOf(n);
    return `<button class="item" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(n.id)}"><span class="stamp-slot" style="width:52px;height:52px">${stampSVG(n.glyph || "?", n.id, topLevel(p.id, n.id), stampsOf(p.id, n.id))}</span>
      <span>${num ? `<span class="num">${num}</span>` : ""}<h3>${esc(n.title)}${isNotionNew(p, n.id) ? ` <span class="tag new">Nouveau</span>` : ""}</h3><div class="sum">${esc(n.summary || "")}</div>${lv.length === 0 ? `<div class="small muted" style="margin-top:3px">En préparation</div>` : lv.length < 3 ? `<div class="small muted" style="margin-top:3px">Niveaux disponibles : ${lv.map(l => LEVELS[l]).join(", ")}</div>` : ""}</span>
      ${minis(p.id, n.id)}</button>`;
  }
  function drawerHTML(p, n) {
    if (!n._kids.length) return "";
    const key = p.id + "/" + n.id; const open = openKids.has(key);
    const done = n._kids.filter(c => topLevel(p.id, c.id) >= 1).length;
    return `<div class="drawer${open ? " open" : ""}"><button class="drawer-toggle" data-act="kids" data-k="${esc(key)}" aria-expanded="${open}"><span class="chev" aria-hidden="true">›</span><span>${n._kids.length} ${esc((n.childrenLabel || "sous-notions").toLowerCase())}${n._kids.some(c => isNotionNew(p, c.id)) ? ` <span class="tag new">Nouveau</span>` : ""}</span><span class="muted small">${done ? `${done} validé${done > 1 ? "s" : ""}` : ""}</span></button>
      ${open ? `<div class="drawer-list">${n._kids.map(c => `<button class="row-item" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(c.id)}"><span class="stamp-slot" style="width:34px;height:34px">${stampSVG(c.glyph || "?", c.id, topLevel(p.id, c.id), stampsOf(p.id, c.id))}</span><span class="ri-t">${esc(c.title)}${isNotionNew(p, c.id) ? ` <span class="tag new">Nouveau</span>` : ""}</span>${minis(p.id, c.id)}</button>`).join("")}</div>` : ""}</div>`;
  }
  function groupProgress(p, g) { const all = realDesc(g); const done = all.filter(x => topLevel(p.id, x.id) >= 1).length; return { all: all.length, done }; }
  function pathHTML(p) {
    let num = 0;
    return `<div class="path">` + p._tops.map(n => {
      if (n.group) {
        const key = p.id + "/" + n.id; const open = openGroups.has(key); const pr = groupProgress(p, n);
        const body = n._kids.map(c => `<div class="node">${itemHTML(p, c, (++num) + ".")}${drawerHTML(p, c)}</div>`).join("");
        return `<section class="group${open ? " open" : ""}"><div class="group-head"><button class="group-toggle" data-act="group" data-k="${esc(key)}" aria-expanded="${open}"><span class="g-emoji" aria-hidden="true">${esc(n.emoji || "📁")}</span><span class="g-t"><span class="g-title">${esc(n.title)}${realDesc(n).some(x => isNotionNew(p, x.id)) ? ` <span class="tag new">Nouveau</span>` : ""}</span><span class="small muted">${pr.all} notion${pr.all > 1 ? "s" : ""}${pr.done ? `, ${pr.done} validée${pr.done > 1 ? "s" : ""}` : ""}</span><span class="g-bar" aria-hidden="true"><i style="width:${pr.all ? Math.round(pr.done / pr.all * 100) : 0}%"></i></span></span><span class="chev" aria-hidden="true">›</span></button></div>
          ${open ? `<div class="group-body">${n.summary ? `<p class="small muted g-sum">${esc(n.summary)} <button class="pl" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(n.id)}">Présentation de la catégorie</button></p>` : ""}${body}</div>` : ""}</section>`;
      }
      return `<div class="node">${itemHTML(p, n, (++num) + ".")}${drawerHTML(p, n)}</div>`;
    }).join("") + `</div>`;
  }
  function vGroup(p, g) {
    const pr = groupProgress(p, g);
    let h = `<div class="crumb small muted">${esc(p.emoji || "")} ${esc(p.title)}, catégorie</div><h1><span aria-hidden="true">${esc(g.emoji || "")}</span> ${esc(g.title)}</h1><p class="muted">${pr.all} notions, ${pr.done} validée${pr.done > 1 ? "s" : ""}</p>`;
    if (g.intro) h += `<div class="reading">${md(g.intro, p.id)}</div>`;
    h += `<div class="path">` + g._kids.map((c, i) => `<div class="node">${itemHTML(p, c, (i + 1) + ".")}${drawerHTML(p, c)}</div>`).join("") + `</div>`;
    const first = p._seq.find(x => realDesc(g).includes(x));
    if (first) h += `<div class="row" style="margin-top:16px"><button class="btn primary" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(first.id)}">Commencer par « ${esc(first.title)} »</button></div>`;
    return h;
  }

  /* ---------- Sujet ---------- */
  function vPack() {
    const p = PK[S().nav.pack]; if (!p) return vHome();
    const tab = S().nav.tab || "path";
    const tabs = [["path", "Parcours"], ["inquiry", "Enquête"], ["timeline", "Frise"], ["people", "Figures"], ["glossary", "Glossaire"]];
    const fresh = freshNews(p);
    let h = `<div class="pack-head"><span class="kd">État des connaissances : ${esc(p.knowledge || "")}</span><h1><span aria-hidden="true">${esc(p.emoji || "")}</span> ${esc(p.title)}</h1></div>
      ${fresh.length ? `<div class="card news-card"><strong><span class="tag new">Nouveau</span> Depuis ta dernière visite</strong><ul>${fresh.map(x => `<li><span class="small muted">${esc(String(x.date).split("-").reverse().join("/"))}</span> ${esc(x.text)}</li>`).join("")}</ul><p class="small muted" style="margin:0">Les notions concernées portent le repère « Nouveau » jusqu’à ce que tu les ouvres.</p></div>` : ""}
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" data-act="ptab" data-k="${k}" aria-selected="${tab === k}">${l}</button>`).join("")}</div>`;
    if (tab === "path") {
      h += `<div class="lead reading">${md(p.intro || "", p.id)}</div>` + pathHTML(p);
      if (p.resources && p.resources.length) h += `<h2>Pour tout le sujet</h2>` + resList(p.resources);
      h += `<div class="row" style="margin-top:18px">${flagBtn({ pack: p.id, kind: "nouvelle", ref: "sujet", label: "Nouvelles notions pour " + p.title }, "Proposer d’autres notions")}</div>`;
    }
    if (tab === "inquiry") {
      h += `<div class="inq-hero">${esc(p.question)}</div><p class="muted">L’enquête découpe la grande question en pistes. Obtiens le tampon Découverte des notions de chaque piste pour en révéler la conclusion.</p>`;
      (p.inquiry || []).forEach((c, i) => {
        const done = c.notions.every(nn => topLevel(p.id, nn) >= 1);
        h += `<div class="card clue"><div class="n">Piste ${i + 1}</div><h3>${esc(c.q)}</h3><p style="margin:0">${esc(c.intro)}</p>
          <div class="nlinks">${c.notions.map(nn => { const n = p._n[nn]; return n ? `<button class="chip" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(nn)}">${minis(p.id, nn)} ${esc(n.title)}</button>` : ""; }).join("")}</div>
          ${done ? `<div class="found"><strong style="font-family:var(--f-ui)">Ce que l’enquête a établi.</strong> ${esc(c.conclusion)}</div>` : `<div class="locked">Conclusion à découvrir : ${c.notions.filter(nn => topLevel(p.id, nn) >= 1).length} notion(s) sur ${c.notions.length} validée(s).</div>`}</div>`;
      });
    }
    if (tab === "timeline") {
      h += `<p class="muted">Les jalons qui ont façonné le sujet : ce qu’on a découvert, qui l’a fait, et les questions restées en suspens. Marque « à développer » ceux qui mériteraient une leçon à part entière.</p><div class="tl">` + (p.timeline || []).map((e, i) => tlEvent(p, e, i)).join("") + `</div>`;
    }
    if (tab === "people") {
      const people = (p.people || []).slice().sort((a, b) => a.n.localeCompare(b.n, "fr"));
      h += `<p class="muted">Les femmes et les hommes qui ont fait avancer le sujet. Les portraits marqués « Leçon » ont une page complète.</p>` + people.map(x => personCard(p, x)).join("");
    }
    if (tab === "glossary") {
      const list = (p.glossary || []).slice().sort((a, b) => a.t.localeCompare(b.t, "fr"));
      h += `<input type="search" id="gl-search" placeholder="Chercher un terme" aria-label="Chercher dans le glossaire"><dl class="gloss" id="gl-list">` + list.map(g => `<div data-gt="${esc((g.t + " " + g.d).toLowerCase())}" id="gl-${esc(g.id)}"><dt>${esc(g.t)}</dt><dd>${esc(g.d)}${usedIn(p, g.id)}<div style="margin-top:6px">${flagBtn({ pack: p.id, kind: "glossaire", ref: g.id, label: g.t }, "Expliquer davantage")}</div></dd></div>`).join("") + `</dl>
        <div class="row" style="margin-top:14px">${flagBtn({ pack: p.id, kind: "glossaire", ref: "nouveaux", label: "Nouveaux termes pour " + p.title }, "Proposer d’autres termes")}</div>`;
    }
    return h;
  }
  function tlEvent(p, e, i) {
    const ppl = (e.people || []).map(id => p._pp[id]).filter(Boolean);
    const linked = new Set(ppl.map(x => x.id));
    return `<div class="ev${S().nav.hl === (e.id || i) ? " hl" : ""}" id="ev-${esc(e.id || i)}"><div class="y">${esc(e.y)}</div><div class="box"><h3>${esc(e.t)}</h3><p class="small" style="margin:0 0 10px">${rich(e.d, p.id, linked)}</p>
      ${e.open ? `<div class="open small"><strong>En suspens.</strong> ${rich(e.open, p.id, linked)}</div>` : ""}
      ${ppl.length ? `<div class="nlinks">${ppl.map(x => `<button class="chip person-chip" data-act="person" data-p="${esc(p.id)}" data-x="${esc(x.id)}">👤 ${esc(x.n)}</button>`).join("")}</div>` : ""}
      <div class="nlinks">${(e.notions || []).map(nn => p._n[nn] ? `<button class="chip" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(nn)}">${minis(p.id, nn)} ${esc(p._n[nn].title)}</button>` : "").join("")}</div>
      <div style="margin-top:10px">${flagBtn({ pack: p.id, kind: "frise", ref: e.id || e.y, label: e.y + " : " + e.t })}</div></div></div>`;
  }
  function personCard(p, x, compact) {
    return `<div class="card person"><div class="spread" style="align-items:flex-start"><div><h3 style="margin:0"><button class="pl" data-act="person" data-p="${esc(p.id)}" data-x="${esc(x.id)}">${esc(x.n)}</button></h3><div class="small muted">${esc(x.y || "")}</div></div>${x.lesson ? `<span class="tag lesson">Leçon</span>` : ""}</div>
      <p style="margin:10px 0 12px">${rich(x.d || "", p.id, new Set([x.id]))}</p>
      <div class="row wrap"><button class="btn small ${x.lesson ? "primary" : ""}" data-act="person" data-p="${esc(p.id)}" data-x="${esc(x.id)}">${x.lesson ? "Lire la leçon complète" : "Voir le portrait"}</button>${x.lesson ? "" : flagBtn({ pack: p.id, kind: "figure", ref: x.id, label: x.n }, "Demander une leçon complète")}</div></div>`;
  }
  function usedIn(p, gid) {
    const re = new RegExp("\\{\\{" + gid.replace(/[-]/g, "\\-") + "(\\||\\}\\})");
    const ns = p.notions.filter(n => levelsOf(n).some(l => re.test(n.levels[l].text)));
    if (!ns.length) return "";
    return `<div class="used">Voir : ${ns.map(n => `<button class="wl" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(n.id)}">${esc(n.title)}</button>`).join(", ")}</div>`;
  }
  function resList(list) {
    return `<div>` + list.map(r => `<div class="res"><span class="ic" aria-hidden="true">${I[r.type] || I.article}</span><div>
      ${r.url ? `<a class="t" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>` : `<span class="t">${esc(r.title)}</span>`}${r.lang === "en" ? `<span class="tag en" title="Ressource en anglais">EN</span>` : ""}${r.level ? `<span class="tag lvl">${LEVELS[r.level]}</span>` : ""}
      <div class="small muted">${esc(RES_LABEL[r.type] || "Ressource")}${r.author ? ", " + esc(r.author) : ""}</div>${r.note ? `<div class="small" style="margin-top:3px">${esc(r.note)}</div>` : ""}</div></div>`).join("") + `</div>`;
  }

  /* ---------- Fiche notion ---------- */
  function vNotion() {
    const p = PK[S().nav.pack]; const n = p && p._n[S().nav.notion]; if (!n) return vHome();
    if (n.group) return vGroup(p, n);
    const k = nkey(p.id, n.id);
    const avail = levelsOf(n);
    let lv = Math.max(1, Math.min(3, S().nav.level || P().levels[k] || 1));
    const L = n.levels[lv];
    const st = stampsOf(p.id, n.id);
    const prev = p._seq[n._s - 1], next = p._seq[n._s + 1];
    const crumb = n._par ? `${esc(p.emoji || "")} <button class="pl" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(n._par.id)}" data-replace="1">${esc(n._par.title)}</button>, ${esc((n._par.childLabel || "notion").toLowerCase())} ${n._k + 1} sur ${n._par._kids.length}` : `${esc(p.emoji || "")} ${esc(p.title)}, notion ${n._s + 1} sur ${p._seq.length}`;
    let h = `<div class="pn-top">${prev ? `<button class="btn small" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(prev.id)}" data-replace="1" title="${esc(prev.title)}">‹ Précédente</button>` : "<span></span>"}${next ? `<button class="btn small" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(next.id)}" data-replace="1" title="${esc(next.title)}">Suivante : ${esc(next.title.length > 26 ? next.title.slice(0, 25) + "…" : next.title)} ›</button>` : "<span></span>"}</div>
      <div class="notion-head"><div><div class="crumb">${crumb}</div><h1>${esc(n.title)}</h1><p class="muted" style="margin:0">${esc(n.summary || "")}</p></div>
      <div class="stamp-slot">${stampSVG(n.glyph || "?", n.id, topLevel(p.id, n.id), st)}</div></div>
      <div class="levelbar lv${lv}"><div class="levelbar-in">
        <button class="step" data-act="lvl" data-d="-1" ${lv <= 1 ? "disabled" : ""} aria-label="Niveau moins approfondi">−</button>
        <div class="strata" aria-live="polite"><span class="bars" aria-hidden="true">${[1, 2, 3].map(l => `<i class="${l <= lv ? "f" + lv : ""}"></i>`).join("")}</span><span class="lab">${LEVELS[lv]}<small>${n.minutes ? "environ " + n.minutes[lv - 1] + " min" : ""}${st[lv] ? ", tampon obtenu" : ""}</small></span></div>
        <button class="step" data-act="lvl" data-d="1" ${lv >= 3 ? "disabled" : ""} aria-label="Niveau plus approfondi">+</button>
      </div></div><div class="lv${lv}"><div class="n-grid"><article class="n-main">`;
    if (L && L.text) {
      h += `<p class="adds"><b>${LEVELS[lv]}.</b> ${esc(L.adds || "")}</p><div class="reading">${md(L.text, p.id)}</div>`;
      if (L.quiz && L.quiz.length) h += `<div class="test-cta"><div><strong>${st[lv] ? "Tampon " + LEVELS[lv] + " obtenu" : "Gagner le tampon " + LEVELS[lv]}</strong><div class="small muted">${L.quiz.length} questions, ${Math.ceil(L.quiz.length * 2 / 3)} bonnes réponses suffisent.</div></div><button class="btn lv" data-act="quiz" data-l="${lv}">${st[lv] ? "Refaire le test" : "Se tester"}</button></div>`;
    } else {
      h += `<div class="pending"><strong>Niveau ${LEVELS[lv]} en cours de rédaction.</strong><br>${avail.length ? `En attendant, le niveau ${LEVELS[avail[avail.length - 1]]} est disponible.` : ""}<div style="margin-top:12px">${flagBtn({ pack: p.id, kind: "niveau", ref: n.id + "/" + lv, label: n.title + ", niveau " + LEVELS[lv] }, "Demander ce niveau")}</div></div>`;
    }
    if (n._kids.length) h += `<h2>${esc(n.childrenLabel || "Sous-notions")}</h2><div class="kids">${n._kids.map(c => `<button class="item sub" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(c.id)}"><span class="stamp-slot" style="width:40px;height:40px">${stampSVG(c.glyph || "?", c.id, topLevel(p.id, c.id), stampsOf(p.id, c.id))}</span><span><h3>${esc(c.title)}</h3><div class="sum">${esc(c.summary || "")}</div></span>${minis(p.id, c.id)}</button>`).join("")}</div>`;
    const tl = (p.timeline || []).filter(e => (e.notions || []).includes(n.id));
    const pre = (n.prereq || []).filter(x => p._n[x]); const nxt = (n.next || []).filter(x => p._n[x]);
    let side = "";
    { let h = "";
    if (pre.length || nxt.length) {
      h += `<h2>Liens</h2>`;
      if (pre.length) h += `<p class="small muted" style="margin-bottom:6px">Pour bien comprendre, voir d’abord</p><div class="chips" style="margin-bottom:12px">${pre.map(x => `<button class="chip" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(x)}">${minis(p.id, x)} ${esc(p._n[x].title)}</button>`).join("")}</div>`;
      if (nxt.length) h += `<p class="small muted" style="margin-bottom:6px">Cette notion ouvre sur</p><div class="chips">${nxt.map(x => `<button class="chip" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(x)}">${minis(p.id, x)} ${esc(p._n[x].title)}</button>`).join("")}</div>`;
    }
    if (tl.length) h += `<h2>Sur la frise</h2><div class="chips">${tl.map(e => `<button class="chip" data-act="tl" data-i="${esc(e.id)}"><span class="y">${esc(e.y)}</span> ${esc(e.t)}</button>`).join("")}</div>`;
    side = h; }
    if (n.misconceptions && n.misconceptions.length) h += `<h2>Idées reçues</h2><ul class="section-list">${n.misconceptions.map((m, i) => `<li><div class="myth">${esc(m.myth)}</div><p style="margin:6px 0 8px">${rich(m.truth, p.id)}</p>${flagBtn({ pack: p.id, kind: "idee", ref: n.id + "/" + i, label: m.myth })}</li>`).join("")}</ul>`;
    if (n.debates && n.debates.length) h += `<h2>Débats ouverts et inconnues</h2><ul class="section-list">${n.debates.map((d, i) => typeof d === "string" ? `<li>${esc(d)}</li>` : `<li><strong>${esc(d.t)}</strong><p style="margin:6px 0 8px">${rich(d.d, p.id)}</p>${flagBtn({ pack: p.id, kind: "debat", ref: n.id + "/" + i, label: d.t })}</li>`).join("")}</ul>`;
    const figs = (n.figures || []).map(f => typeof f === "string" ? p._pp[f] : f).filter(Boolean);
    if (figs.length) h += `<h2>Grandes figures</h2>` + figs.map(x => x.id ? personCard(p, x) : `<div class="card person"><h3 style="margin:0">${esc(x.n)}</h3><div class="small muted">${esc(x.y || "")}</div><p style="margin:8px 0 0">${esc(x.d)}</p></div>`).join("");
    h += `<h2>Pour aller plus loin</h2>` + (n.resources && n.resources.length ? resList(n.resources) : `<p class="muted small">Les ressources de cette notion arriveront avec ses niveaux Intermédiaire et Expert.</p>`);
    h += `<h2>Mes notes</h2><p class="small muted">Une seule fiche de notes pour les trois niveaux. Tes questions et remarques peuvent être jointes à l’export « À développer » : elles serviront à enrichir la fiche.</p><textarea data-note="${esc(k)}" placeholder="Ce que je retiens, mes questions, des liens avec d’autres sujets…">${esc(P().notes[k] || "")}</textarea>`;
    h += `<div class="card" style="margin-top:18px"><strong>Il manque quelque chose sur cette fiche ?</strong><p class="small muted" style="margin:4px 0 10px">Marque-la : la demande rejoindra la liste « À développer » des réglages, avec ta précision éventuelle.</p>${flagBtn({ pack: p.id, kind: "notion", ref: n.id, label: n.title }, "Approfondir cette fiche")}</div>`;
    h += `</article>${side ? `<aside class="n-side">${side}</aside>` : ""}</div>`;
    h += `<div class="pn">${prev ? `<button data-act="notion" data-p="${esc(p.id)}" data-n="${esc(prev.id)}" data-replace="1"><small>Précédente</small>${esc(prev.title)}</button>` : "<span></span>"}${next ? `<button class="next" data-act="notion" data-p="${esc(p.id)}" data-n="${esc(next.id)}" data-replace="1"><small>Suivante</small>${esc(next.title)}</button>` : "<span></span>"}</div></div>`;
    return h;

    const a = el.dataset.act, d = el.dataset; const s = S();

    switch (a) {

      case "export-req": {
        if (!confirm("Exporter les demandes dans un fichier, puis vider la liste ?")) break;
        download(requestFile(), "tartiflette-demandes-" + today() + ".json"); markSent(); s.requests = []; save(); render(); toast("Demandes exportées, liste vidée."); break;
      }
      case "copy-req": {
        const txt = JSON.stringify(requestFile(), null, 2);
        (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => {
          toast("Texte copié : colle-le dans ton message à Claude.");
          setTimeout(() => { if (confirm("Vider la liste des demandes maintenant ?")) { markSent(); s.requests = []; save(); render(); } }, 300);
        }).catch(() => toast("Copie impossible ici : utilise l’export."));
        break;
      }
      case "del-mod": if (confirm("Retirer ce module ? Ta progression est conservée.")) T.removeModule(d.k, d.id).then(() => { T.applyPrefs(); render(); toast("Module retiré."); }); break;
      case "goto-themes": stack.length = 0; go({ view: "settings" }, false); setTimeout(() => { const t = document.getElementById("themes"); if (t) t.scrollIntoView({ block: "start" }); }, 30); break;
      case "search-go": {
        const r = lastResults[+d.i]; if (!r) break;
        const nav = Object.assign({}, r.e.nav); if (r.lvl) nav.level = r.lvl; else if (nav.view === "notion") nav.level = P().levels[nkey(nav.pack, nav.notion)] || 1;
        go(nav);
        if (r.e.gloss) setTimeout(() => { const e = document.getElementById("gl-" + r.e.gloss); if (e) { e.scrollIntoView({ block: "center" }); e.style.background = "var(--soft)"; } }, 40);
        break;
      }
      case "home-sort": s.settings.homeSort = d.k; save(); render(); break;
      case "home-detail": s.settings.homeDetail = !s.settings.homeDetail; save(); render(); break;
      case "soon": { const on = toggleReq({ pack: d.p, kind: "sujet", ref: d.p, label: d.t }); toast(on ? `${d.t} : demande ajoutée à « À développer ».` : "Demande retirée."); render(); break; }
      case "add-profile": { const id = "p" + uid(); s.profiles.push({ id, name: "Profil " + (s.profiles.length + 1) }); s.data[id] = freshProfile(); save(); render(); break; }
      case "del-profile": { if (!confirm("Supprimer ce profil et toute sa progression ?")) break; s.profiles = s.profiles.filter(x => x.id !== d.id); delete s.data[d.id]; if (s.current === d.id) s.current = s.profiles[0].id; save(); render(); break; }
      case "export": download({ app: "tartiflette", type: "progression", exported: new Date().toISOString(), state: s }, "tartiflette-progression-" + today() + ".json"); toast("Progression exportée."); break;
      case "scale": s.settings.scale = Math.max(0.85, Math.min(1.4, Math.round((s.settings.scale + Number(d.d)) * 100) / 100)); T.applyPrefs(); save(); break;
      case "theme": s.settings.theme = d.k; T.applyPrefs(); save(); render(); break;
      case "reset": if (confirm("Effacer les tampons, révisions et notes de ce profil ?")) { s.data[s.current] = freshProfile(); save(); render(); toast("Progression effacée."); } break;
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") document.querySelectorAll(".sheet").forEach(x => x.remove());
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("pack-row")) { e.preventDefault(); go({ view: "pack", pack: e.target.dataset.p, tab: "path" }); }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("figure[data-act='zoom']")) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener("input", ev => {
    const el = ev.target; const s = S();
    if (el.dataset.note) { if (el.value.trim()) P().notes[el.dataset.note] = el.value; else delete P().notes[el.dataset.note]; save(); }
    if (el.dataset.reqnote) { const r = s.requests.find(x => x.key === el.dataset.reqnote); if (r) { r.note = el.value; save(); } }
    if (el.dataset.pname) { const pr = s.profiles.find(x => x.id === el.dataset.pname); if (pr) { pr.name = el.value.trim() || "Sans nom"; save(); const w = $(".who"); if (w && pr.id === s.current) w.textContent = pr.name; } }
    if (el.id === "gl-search") { const q = el.value.trim().toLowerCase(); document.querySelectorAll("#gl-list > div").forEach(x => { x.hidden = q && !x.dataset.gt.includes(q); }); }
    if (el.id === "search-q") { s.nav.q = el.value; save(); lastResults = searchResults(el.value); $("#search-res").innerHTML = resultsHTML(el.value); }
    if (el.id === "pack-search") { const q = el.value.trim().toLowerCase(); document.querySelectorAll(".pack-row").forEach(x => { x.hidden = q && !x.dataset.name.includes(q); }); }
    if (el.dataset.act === "fig-z") { const f = document.getElementById(el.dataset.f); f.dataset.z = el.value; drawFigures(f.parentElement); }
    if (el.dataset.act === "fig-d") { const f = document.getElementById(el.dataset.f); f.dataset.d = Math.pow(10, parseFloat(el.value)) * 1.3; drawFigures(f.parentElement); }
    if (el.dataset.act === "fig-a") { const f = document.getElementById(el.dataset.f); f.dataset.a = el.value; drawFigures(f.parentElement); }
  });
  document.addEventListener("change", async ev => {
    const el = ev.target; const s = S();
    if (el.dataset.act === "use-profile") { s.current = el.dataset.id; save(); render(); toast("Profil : " + (s.profiles.find(x => x.id === s.current) || {}).name); }
    if (el.id === "rq-pack") { $("#rq-newwrap").hidden = el.value !== "_new"; }
    if (el.dataset.act === "opt") { s.settings[el.dataset.k] = el.checked; save(); render(); }
    if ((el.id === "mod-file" || el.id === "mod-file-2") && el.files[0]) {
      try {
        const m = JSON.parse(await el.files[0].text());
        if (m.type === "bundle") { const r = await T.importBundle(m); INDEX = null; T.applyPrefs(); render(); toast(`Contenu mis à jour : ${r.added} ajouté${r.added > 1 ? "s" : ""}, ${r.updated} mis à jour, ${r.kept} déjà à jour.`); return; }
        if (m.type === "demandes" || m.type === "progression") { toast("Ce fichier n’est pas un module."); return; }
        const kept = await T.importModule(m);
        const target = T.isExt(kept) ? PK[kept.target] : PK[kept.id];
        INDEX = null; T.applyPrefs(); render(); toast(T.isThemes(kept) ? `Thèmes « ${kept.title} » ajoutés : choisis-les dans Réglages.` : T.isExt(kept) ? `Extension « ${kept.title || kept.id} » ajoutée${target ? " à " + target.title : " (domaine en attente)"}.` : `Domaine « ${kept.title} » installé.`);
      } catch (e) { toast("Ce fichier n’est pas un module valide."); }
    }
    if (el.id === "save-file" && el.files[0]) {
      try { const j = JSON.parse(await el.files[0].text()); if (j.app !== "tartiflette" && j.app !== "strates") throw 0; if (!j.state || !j.state.profiles) throw 0; if (!confirm("Remplacer la progression actuelle par celle du fichier ?")) return; j.state.requests = j.state.requests || []; T.S = j.state; save(); T.applyPrefs(); render(); toast("Progression importée."); }
      catch (e) { toast("Ce fichier n’est pas une sauvegarde Tartiflette."); }
    }
  });
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { T.applyPrefs(); render(); });

  /* ---------- Démarrage ---------- */
  document.querySelectorAll(".nav button").forEach(b => { b.innerHTML = I[b.dataset.icon] + "<span>" + b.dataset.label + "</span>" + (b.dataset.v === "review" ? `<span class="count" id="due-badge" hidden>0</span>` : b.dataset.v === "settings" ? `<span class="count soft" id="req-badge" hidden>0</span>` : ""); });
  T.applyPrefs();
  $("#main").innerHTML = `<div class="empty">Préparation de la tartiflette…</div>`;
  T.loadModules().then(() => { if (["quiz"].includes(S().nav.view)) S().nav = { view: "home" }; T.applyPrefs(); render(); });
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();

</script>
</body>
</html>
